[project]
name = "ci-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai==2.33.0",
  "pydantic-ai-harness[dynamic-workflow]==0.24.0",
  "pydantic-evals==2.33.0",
  "openai>=1.0",
  "pydantic-settings>=2.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "playwright>=1.50",
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "pypdf>=5",
  "tenacity>=9",
  "ddgs>=9.0",
  "markdownify>=1.2",
  "python-dotenv>=1.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "psycopg2-binary>=2.9",
  "boto3>=1.35",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30",
  "python-docx>=1.1",
  "robotexclusionrulesparser>=1.7",
  "cachetools>=5.5",
  "prometheus-client>=0.21",
]

[project.scripts]
ci-agent = "ci_agent.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
